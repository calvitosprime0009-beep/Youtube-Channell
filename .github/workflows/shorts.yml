name: Fábrica de Shorts

on:
  schedule:
    - cron: "0 8,14,20 * * *"    # 3 vídeos al día (UTC). En España: 10:00, 16:00, 22:00
  workflow_dispatch:             # botón para lanzarlo a mano cuando quieras

permissions:
  contents: write                # para guardar la memoria del cerebro

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q -r shorts-factory/requirements.txt

      - name: Producir y subir el Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAIS: ES
          PRIVACIDAD: public
        run: python shorts-factory/src/main.py

      - name: Guardar lo aprendido
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add shorts-factory/data/memory.json
          git diff --staged --quiet || git commit -m "cerebro: actualizado $(date -u +%H:%M)"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short
          path: shorts-factory/salida/*.mp4
          retention-days: 7
